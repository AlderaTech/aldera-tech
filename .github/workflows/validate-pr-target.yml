name: Validate PR Source

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  validate-pr-source:
    name: Validate PR Source Branch
    runs-on: ubuntu-latest
    steps:
      - name: Verify source branch restrictions
        run: |
          TARGET_BRANCH="${{ github.base_ref }}"
          SOURCE_BRANCH="${{ github.head_ref }}"

          echo "Target branch: $TARGET_BRANCH"
          echo "Source branch: $SOURCE_BRANCH"

          if [[ "$TARGET_BRANCH" == "main" ]]; then
            # main branch ONLY accepts PRs from 'staging' or 'hotfix/*'
            if [[ "$SOURCE_BRANCH" == "staging" || "$SOURCE_BRANCH" =~ ^hotfix/ ]]; then
              echo "✅ Valid: PR to 'main' originates from '$SOURCE_BRANCH'."
              exit 0
            else
              echo "❌ Invalid: PR to 'main' must originate from 'staging' or 'hotfix/*'."
              echo "Detected source branch: '$SOURCE_BRANCH'"
              exit 1
            fi
          elif [[ "$TARGET_BRANCH" == "staging" ]]; then
            # staging branch accepts PRs from feat/*, fix/*, refactor/*, chore/*, docs/*, test/*
            if [[ "$SOURCE_BRANCH" =~ ^(feat|fix|refactor|chore|docs|test)/ ]]; then
              echo "✅ Valid: PR to 'staging' originates from valid branch '$SOURCE_BRANCH'."
              exit 0
            else
              echo "❌ Invalid: PR to 'staging' must have prefix feat/*, fix/*, refactor/*, chore/*, docs/*, or test/*."
              echo "Detected source branch: '$SOURCE_BRANCH'"
              exit 1
            fi
          fi
