name: Build and Deploy

on:
  push:
    branches:
      - main
      - staging
    tags:
      - v*
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      diagnose_staging:
        description: "Read-only staging container diagnostics (no build or deploy)"
        type: boolean
        default: false
      inspect_staging_ai:
        description: "Inspect staging AI configuration metadata without revealing secrets"
        type: boolean
        default: false
      repair_staging_ai:
        description: "Repair staging bearer using an existing upstream API key (no new key, no AI charge)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: alderatech/aldera-tech

jobs:
  diagnose-staging:
    name: Inspect Staging Startup
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_staging && !inputs.repair_staging_ai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect staging container without changing runtime or data
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          key: ${{ secrets.VPS_KEY }}
          script_path: ${{ inputs.inspect_staging_ai && 'docker/inspect-staging-ai.sh' || 'docker/inspect-staging.sh' }}

  repair-staging-ai:
    name: Repair Staging Upstream Authentication
    if: github.event_name == 'workflow_dispatch' && inputs.repair_staging_ai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          key: ${{ secrets.VPS_KEY }}
          command_timeout: 5m
          script_path: docker/repair-staging-ai.sh

  plan:
    name: Plan CI Runners & Shards
    if: github.event_name != 'workflow_dispatch' || (!inputs.diagnose_staging && !inputs.repair_staging_ai)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      lint_matrix: ${{ steps.plan.outputs.lint_matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Plan suites from recent job durations
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun --no-env-file scripts/ci/plan-tests.ts
      - uses: actions/upload-artifact@v4
        with:
          name: ci-test-plan
          path: ci-test-plan.json
          retention-days: 7

  lint:
    name: Linter & Static Analysis (shard ${{ matrix.shard }}/${{ matrix.total }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.lint_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun --no-env-file scripts/ci/run-lint.ts ${{ matrix.shard }} ${{ matrix.total }}

  typecheck:
    name: Next.js Types & TypeScript
    if: github.event_name != 'workflow_dispatch' || (!inputs.diagnose_staging && !inputs.repair_staging_ai)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx next typegen
      - run: bun run typecheck

  configuration:
    name: Configuration & Infrastructure Safeguards
    if: github.event_name != 'workflow_dispatch' || (!inputs.diagnose_staging && !inputs.repair_staging_ai)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Test staging credential repair safeguards
        run: python3 -B docker/staging-relay-auth-test.py
      - name: Checkout infrastructure configuration templates
        uses: actions/checkout@v4
        with:
          repository: Alfian57/server-infrastructure
          path: .server-infra
      - name: Config drift and secret leak scan
        run: bun run scripts/scan-config-drift.ts --example .env.example --template .server-infra/roles/applications/portfolio-apps/templates/aldera.env.j2

  test-suites:
    name: ${{ matrix.label }} (shard ${{ matrix.shard }}/${{ matrix.total }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    services:
      postgres:
        image: ${{ matrix.suite == 'integration' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aldera_tech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aldera_tech_test?schema=public"
      ROUTER_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aldera_router_test"
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned router test schema
        if: matrix.suite == 'integration'
        uses: actions/checkout@v4
        with:
          repository: Alfian57/server-infrastructure
          ref: b6c89b69f39ea5d6f5fbcba2dcb6bb9b22ee0c0e
          path: .server-infra
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Initialize ephemeral test databases
        if: matrix.suite == 'integration'
        run: sh scripts/ci/setup-databases.sh
      - name: Run isolated suite shard
        run: bun --no-env-file scripts/ci/run-tests.ts ${{ matrix.suite }} ${{ matrix.shard }} ${{ matrix.total }}
      - name: Upload JUnit report and file manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.suite }}-${{ matrix.shard }}
          path: .ci-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  validate:
    # Keep the existing required check name while independent runners run in parallel.
    name: Validate Code & Types
    needs: [plan, lint, typecheck, configuration]
    if: always() && (github.event_name != 'workflow_dispatch' || (!inputs.diagnose_staging && !inputs.repair_staging_ai))
    runs-on: ubuntu-latest
    steps:
      - name: Require every analysis runner to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPES_RESULT: ${{ needs.typecheck.result }}
          CONFIG_RESULT: ${{ needs.configuration.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$LINT_RESULT" = success
          test "$TYPES_RESULT" = success
          test "$CONFIG_RESULT" = success

  test:
    name: Run Unit & Integration Tests
    needs: [plan, test-suites]
    if: always() && (github.event_name != 'workflow_dispatch' || (!inputs.diagnose_staging && !inputs.repair_staging_ai))
    runs-on: ubuntu-latest
    steps:
      - name: Require every test runner to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          TEST_RESULT: ${{ needs.test-suites.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$TEST_RESULT" = success
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: .ci-reports
          merge-multiple: true
      - name: Verify all test files ran exactly once
        run: bun --no-env-file scripts/ci/test-results.ts

  docker:
    name: Build and Publish Docker Image
    needs: [validate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ github.ref == 'refs/heads/staging' && (vars.NEXT_PUBLIC_APP_URL_STAGING || 'https://staging.aldera.tech') || (vars.NEXT_PUBLIC_APP_URL || 'https://aldera.tech') }}
            NEXTAUTH_URL=${{ github.ref == 'refs/heads/staging' && (vars.NEXTAUTH_URL_STAGING || 'https://staging.aldera.tech') || (vars.NEXTAUTH_URL || vars.NEXT_PUBLIC_APP_URL || 'https://aldera.tech') }}

      - name: Reconcile staging upstream authentication
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/staging'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          key: ${{ secrets.VPS_KEY }}
          command_timeout: 5m
          script_path: docker/repair-staging-ai.sh

      - name: Deploy to VPS (Staging)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/staging'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            set -eu
            cd /opt/docker-stack/applications/aldera-tech-staging
            ./update.sh

      - name: Verify staging application startup
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/staging'
        uses: appleboy/ssh-action@v1
        env:
          VERIFY_STAGING_READY: "true"
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          key: ${{ secrets.VPS_KEY }}
          envs: VERIFY_STAGING_READY
          command_timeout: 3m
          script_path: docker/inspect-staging.sh

      - name: Deploy to VPS (Production)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            set -eu
            cd /opt/docker-stack/applications/aldera-tech
            ./update.sh
