name: Build and Deploy

on:
  push:
    branches:
      - main
      - staging
    tags:
      - v*
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: alderatech/aldera-tech

jobs:
  validate:
    name: Validate Code & Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint check
        run: bun run lint

      - name: Generate Next.js types
        run: bunx next typegen

      - name: Type check
        run: bunx tsc --noEmit

  docker:
    name: Build and Publish Docker Image
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ github.ref == 'refs/heads/staging' && (vars.NEXT_PUBLIC_APP_URL_STAGING || 'https://staging.aldera.tech') || (vars.NEXT_PUBLIC_APP_URL || 'https://aldera.tech') }}
            NEXTAUTH_URL=${{ github.ref == 'refs/heads/staging' && (vars.NEXTAUTH_URL_STAGING || 'https://staging.aldera.tech') || (vars.NEXTAUTH_URL || vars.NEXT_PUBLIC_APP_URL || 'https://aldera.tech') }}

      - name: Deploy to VPS (Staging)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/staging'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            set -eu
            cd /opt/docker-stack/applications/aldera-tech-staging
            ./update.sh

      - name: Deploy to VPS (Production)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            set -eu
            cd /opt/docker-stack/applications/aldera-tech
            ./update.sh
